name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version

          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME is: $JAVA_HOME"

          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java Major Version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect Java major version from environment!"
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version ($JAVA_MAJOR) is lower than required Java 17!"
            exit 1
          fi

          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore!"
            exit 1
          fi
          echo "Temporary debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for discovered APK paths:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file!"
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty (0 bytes)!"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have .apk extension!"
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk!"
            exit 1
          fi

          echo "Debug APK verified successfully at $EXPECTED_APK"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP:-/tmp}/release_asset_${{ github.run_id }}"
          mkdir -p "$ASSET_DIR"

          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_SAFE=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="android-app"
          fi

          ASSET_FILENAME="${REPO_SAFE}-debug-build-${{ github.run_number }}.apk"
          DEST_ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_ASSET_PATH"

          if [ ! -f "$DEST_ASSET_PATH" ] || [ ! -s "$DEST_ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $DEST_ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${DEST_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_ASSET_PATH ($ASSET_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "::error::GitHub CLI (gh) is not available!"
            exit 1
          fi

          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "::error::Release asset file $ASSET_FILE does not exist!"
            exit 1
          fi

          if [ ! -s "$ASSET_FILE" ]; then
            echo "::error::Release asset file $ASSET_FILE is empty!"
            exit 1
          fi

          case "$ASSET_FILE" in
            *.apk) ;;
            *)
              echo "::error::Release asset file $ASSET_FILE does not have .apk extension!"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Creating GitHub Release with tag: $RELEASE_TAG and title: $RELEASE_TITLE"

          RELEASE_NOTES=$(cat <<'EOF'
          ### Automatically Generated Debug APK

          - **Built by:** GitHub Actions
          - **Workflow Run Number:** ${{ github.run_number }}
          - **Workflow Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}
          - **Build Target:** Debug APK

          > **Notice:** This APK is automatically generated for testing and verification. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always() && steps.upload_artifact.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            RELEASE_VIEW_TITLE=$(gh release view "$RELEASE_TAG" --json name -q .name 2>/dev/null || echo "Debug APK Build #${{ github.run_number }}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_VIEW_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 📱 APK Build & Release Succeeded! 🎉" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title:** $RELEASE_VIEW_TITLE" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release URL:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset File:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK can be downloaded directly from the **Assets** section of the [GitHub Release]($RELEASE_URL) on your Android device." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved on this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed, but the APK build succeeded!"
            echo "The debug APK was built successfully and is preserved as a GitHub Actions artifact."
            echo "Actions artifact 'app-debug-apk' remains available for download."

            echo "### ⚠️ APK Build Succeeded (Release Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was compiled successfully! However, publishing directly to GitHub Releases was not completed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Backup Download Available:**" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions artifact named **\`app-debug-apk\`** was uploaded successfully and is available for download under the summary of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          fi
